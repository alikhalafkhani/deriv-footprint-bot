<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA-MOD Footprint & Tick Delta - Deriv Live</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: Tahoma, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 10px; width: 100%; max-width: 800px; box-sizing: border-box; }
        select { background: #334155; color: white; border: 1px solid #475569; padding: 5px 10px; border-radius: 4px; font-size: 14px; }
        #status { font-size: 13px; font-weight: bold; padding: 5px 10px; border-radius: 4px; }
        .connected { background: #065f46; color: #6ee7b7; }
        .disconnected { background: #991b1b; color: #fca5a5; }
        canvas { background: #000; border: 1px solid #334155; border-radius: 8px; width: 100%; max-width: 800px; height: 450px; }
    </style>
</head>
<body>

    <header>
        <h3>📊 VA-MOD Footprint & Tick Delta</h3>
        <span id="status" class="disconnected">در حال اتصال...</span>
        <div>
            <label>نماد:</label>
            <select id="symbolSelect">
                <option value="R_100">Volatility 100 Index (R_100)</option>
                <option value="R_75">Volatility 75 Index</option>
                <option value="frxEURUSD">EUR/USD</option>
            </select>
        </div>
    </header>

    <canvas id="chartCanvas" width="800" height="450"></canvas>

    <script>
        const statusEl = document.getElementById('status');
        const symbolSelect = document.getElementById('symbolSelect');
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        let ws;
        let ticksData = [];
        
        // لیست اندپوینت‌های جایگزین برای عبور از فیلترینگ و خطای هندشیک
        const endpoints = [
            "wss://ws.derivws.com/websockets/v3?app_id=1089",
            "wss://blue.derivws.com/websockets/v3?app_id=1089",
            "wss://green.derivws.com/websockets/v3?app_id=1089",
            "wss://white.derivws.com/websockets/v3?app_id=1089"
        ];
        let currentEndpointIndex = 0;

        function connect() {
            const url = endpoints[currentEndpointIndex];
            statusEl.textContent = `در حال اتصال (سرور ${currentEndpointIndex + 1})...`;
            
            ws = new WebSocket(url);

            ws.onopen = () => {
                statusEl.textContent = 'متصل شد ✅';
                statusEl.className = 'connected';
                ws.send(JSON.stringify({ ticks: symbolSelect.value }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.tick) {
                    const price = data.tick.quote;
                    const time = new Date(data.tick.epoch * 1000).toLocaleTimeString();
                    ticksData.push({ time, price });
                    if (ticksData.length > 50) ticksData.shift();
                    drawChart();
                }
            };

            ws.onerror = (err) => {
                console.error("WS Error:", err);
            };

            ws.onclose = () => {
                statusEl.textContent = 'ارتباط قطع شد. تغییر سرور...';
                statusEl.className = 'disconnected';
                // چرخش بین سرورهای مختلف در صورت قطعی
                currentEndpointIndex = (currentEndpointIndex + 1) % endpoints.length;
                setTimeout(connect, 2000);
            };
        }

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (ticksData.length === 0) return;

            let minPrice = Math.min(...ticksData.map(d => d.price));
            let maxPrice = Math.max(...ticksData.map(d => d.price));
            let range = maxPrice - minPrice || 1;

            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath();

            ticksData.forEach((d, i) => {
                let x = (i / (ticksData.length - 1 || 1)) * (canvas.width - 60) + 40;
                let y = canvas.height - 40 - ((d.price - minPrice) / range) * (canvas.height - 80);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px Tahoma';
            ticksData.forEach((d, i) => {
                if (i % 5 === 0) {
                    let x = (i / (ticksData.length - 1 || 1)) * (canvas.width - 60) + 40;
                    let y = canvas.height - 10;
                    ctx.fillText(d.time, x - 20, y);
                }
            });
        }

        symbolSelect.addEventListener('change', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ forget_all: "ticks" }));
                ws.send(JSON.stringify({ ticks: symbolSelect.value }));
                ticksData = [];
            }
        });

        connect();
    </script>
</body>
</html>
